<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<meta name="description" content="Smbl Journal" />
		<meta property="og:title" content="Smbl Journal" />
		<meta property="og:description" content="Smbl Journal" />
		<meta property="og:image" content="https://journal.smbl.dev/smbl-journal.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://journal.smbl.dev/smbl-journal.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Piazzolla:ital,opsz,wght@0,8..30,400..600;1,8..30,400..600&family=Newsreader:ital,opsz,wght@0,6..72,400..500;1,6..72,400..500&family=Special+Elite&family=Cormorant+Garamond:ital,wght@0,400..600;1,400..600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..600&family=IBM+Plex+Mono:wght@400;500;600&family=Caveat:wght@400..700&family=Courier+Prime&family=Kalam:wght@400;700&display=swap"
			rel="stylesheet"
		/>
		<script>
			(() => {
				const theme = localStorage.getItem('theme');
				if (theme === 'dark') document.documentElement.classList.add('dark');

				const PRESETS = {
					journal: ["'Piazzolla', Georgia, serif", "'Newsreader', Georgia, serif", "'Special Elite', 'Courier New', monospace"],
					classic: ["'Cormorant Garamond', Georgia, serif", "'Source Serif 4', Georgia, serif", "'IBM Plex Mono', ui-monospace, monospace"],
					typewriter: ["'Cormorant Garamond', Georgia, serif", "'Courier Prime', 'Courier New', monospace", "'Special Elite', 'Courier New', monospace"],
					handwritten: ["'Caveat', cursive", "'Kalam', 'Comic Sans MS', cursive", "'Special Elite', 'Courier New', monospace"]
				};
				const key = localStorage.getItem('font');
				const p = key && PRESETS[key] ? PRESETS[key] : PRESETS.journal;
				const s = document.documentElement.style;
				s.setProperty('--font-display', p[0]);
				s.setProperty('--font-serif', p[1]);
				s.setProperty('--font-mono', p[2]);

				const entryFonts = {
					serif: "'Newsreader', Georgia, serif",
					classic: "'Source Serif 4', Georgia, serif",
					typewriter: "'Courier Prime', 'Courier New', monospace",
					handwritten: "'Kalam', 'Comic Sans MS', cursive"
				};
				const eKey = localStorage.getItem('entry-font');
				if (eKey && entryFonts[eKey]) s.setProperty('--entry-font', entryFonts[eKey]);

				let size = {};
				try { size = JSON.parse(localStorage.getItem('size') || '{}'); } catch (e) {}
				const uiScale = { small: 0.9, medium: 1, large: 1.1 }[size.ui || 'medium'];
				const entryScale = { small: 0.85, medium: 1, large: 1.2 }[size.entry || 'medium'];
				document.documentElement.style.fontSize = (uiScale * 100) + '%';
				document.documentElement.style.setProperty('--entry-scale', String(entryScale));
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
